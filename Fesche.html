<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fesche — Task Manager, Calendar & Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Fesche.css" />
  </head>

  <body>
    <div class="aurora-backdrop" aria-hidden="true">
      <div class="aurora-ribbon aurora-ribbon-primary"></div>
      <div class="aurora-ribbon aurora-ribbon-cyan"></div>
      <div class="aurora-ribbon aurora-ribbon-magenta"></div>
    </div>

    <input
      type="radio"
      name="viewMode"
      id="view-dashboard"
      class="mode-input"
      checked
    />
    <input
      type="radio"
      name="viewMode"
      id="view-blueprint"
      class="mode-input"
    />

    <div class="app-shell">
      <header class="app-header">
        <div class="header-left">
          <div class="brand-logo">
            <span class="logo-symbol">❖</span>
          </div>
          <div class="brand-info">
            <h1 class="brand-name">Fesche</h1>
            <span class="brand-subtitle">Workspace Schedule System</span>
          </div>
        </div>

        <div class="header-center">
          <div class="status-pill">
            <span class="status-indicator"></span>
            <span class="status-text">Pipeline Connected • Sep 30, 2026</span>
          </div>
        </div>

        <div class="header-right">
          <div class="mode-switcher">
            <label for="view-dashboard" class="switch-label label-dashboard">
              <span class="switch-icon">⚡</span>
              <span>Dashboard</span>
            </label>
            <label for="view-blueprint" class="switch-label label-blueprint">
              <span class="switch-icon">📐</span>
              <span>Blueprint</span>
            </label>
            <div class="switch-slider"></div>
          </div>

          <div class="header-action-btn search-btn">
            <span class="search-icon">⌕</span>
            <span class="kbd-hint">⌘K</span>
          </div>
        </div>
      </header>

      <main class="schematic-viewport">
        <div class="canvas-wrapper">
          <svg
            class="pipeline-schematic"
            viewBox="0 0 1100 680"
            fill="none"
            preserveAspectRatio="none"
          >
            <defs>
              <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
                <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
              </linearGradient>
            </defs>

            <path
              class="wire-base"
              d="M 280 95 L 280 66 A 16 16 0 0 1 296 50 L 934 50 A 16 16 0 0 1 950 66 L 950 130"
            />

            <path
              class="wire-base"
              d="M 400 575 L 440 575 A 16 16 0 0 0 456 559 L 456 286 A 16 16 0 0 1 472 270 L 554 270 A 16 16 0 0 0 570 254 L 570 50"
            />

            <path
              class="wire-pulse wire-pulse-1"
              d="M 280 95 L 280 66 A 16 16 0 0 1 296 50 L 934 50 A 16 16 0 0 1 950 66 L 950 130"
            />

            <path
              class="wire-pulse wire-pulse-2"
              d="M 400 575 L 440 575 A 16 16 0 0 0 456 559 L 456 286 A 16 16 0 0 1 472 270 L 554 270 A 16 16 0 0 0 570 254 L 570 50"
            />

            <circle cx="280" cy="95" r="5.5" class="terminal-node" />
            <circle cx="950" cy="130" r="5.5" class="terminal-node" />
            <circle cx="400" cy="575" r="5.5" class="terminal-node" />
            <circle cx="570" cy="50" r="5" class="junction-node" />
          </svg>

          <section class="card card-task" id="card-task-manager">
            <div class="card-hero-header">
              <div class="title-wrap">
                <span class="card-tag-pill">Tasks</span>
                <h2 class="card-headline">Task<br />manager</h2>
              </div>
              <div class="counter-badge">
                <span class="count-highlight">3</span>/5 done
              </div>
            </div>

            <div class="card-body">
              <div class="task-progress-track">
                <div class="task-progress-fill"></div>
              </div>

              <div class="task-stats">
                <span id="totalCount">Total: 0</span>
                <span id="activeCount">Active: 0</span>
                <span id="completedCount">Completed: 0</span>
              </div>

              <ul class="task-list" id="taskList">
                <li>
                  <label class="task-row">
                    <input type="checkbox" checked class="task-checkbox" />
                    <span class="custom-check"></span>
                    <span class="task-title">Design system tokens & grid</span>
                    <button id="deleteBtn" class="delete.btn">x</button>
                  </label>
                </li>

                <li>
                  <label class="task-row">
                    <input type="checkbox" class="task-checkbox" />
                    <span class="custom-check"></span>
                    <span class="task-title">Calibrate keyboard shortcuts</span>
                    <button id="deleteBtn" class="delete.btn">x</button>
                  </label>
                </li>

                <li>
                  <label class="task-row">
                    <input type="checkbox" class="task-checkbox" />
                    <span class="custom-check"></span>
                    <span class="task-title">Review sprint notes export</span>
                    <button id="deleteBtn" class="delete.btn">x</button>
                  </label>
                </li>
              </ul>

              <div class="card-footer-action">
                <div class="mock-input-field">
                  <button id="addTaskBtn" class="plus-glyph">+</button>
                  <input
                    type="text"
                    id="taskInput"
                    placeholder="Create new task.."
                  />
                  <kbd class="key-tag">↵</kbd>
                </div>
              </div>
            </div>
          </section>

          <!-- FOR NOTES -->
          <section class="card card-notes" id="card-notes">
            <div class="card-hero-header">
              <div class="title-wrap">
                <span class="card-tag-pill">Workspace Memos</span>
                <h2 class="card-headline">Notes</h2>
                <button id="newNoteBtn" type="button">+ New Note</button>
              </div>
              <div class="notes-count">
                <span>4 pinned</span>
              </div>
            </div>

            <section class="notes-layout">
              <aside class="notes-sidebar">
                <div id="notesList"></div>
              </aside>
              <section class="note-editor">
                <div id="editorEmptyState" class="empty-state">
                  <!-- <h2>No note selected</h2> -->
                  <p>Create a new note or select one.</p>
                </div>
                <form id="noteForm" class="hidden">
                  <input type="text" id="noteTitle" placeholder="Note title" />
                  <textarea
                    id="noteContent"
                    placeholder="Write your note here..."
                  ></textarea>
                  <div class="editor-actions">
                    <button type="submit">Save Note</button>
                    <button id="deleteNoteBtn" type="button">Delete</button>
                  </div>
                  <small id="noteUpdatedAt"></small>
                </form>
              </section>
            </section>
          </section>

          <!-- FOR CALENDER -->

          <section class="card card-calendar" id="card-calendar">
            <div class="calendar-header">
              <button id="prevMonth">&lt;</button>
              <div id="monthTitleDiv">
                <button id="todayBtn" style="border: none; background: none;"><h1 id="monthTitle"></h1></button>
                <!-- <button id="todayBtn">Today</button> -->
              </div>
              <button id="nextMonth">&gt;</button>
            </div>
            <div class="weekday-row">
              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
            <section class="event-panel">
              <h2 id="selectedDateTitle">Select a date</h2>
              <form id="eventForm">
                <input id="eventTitle" type="text" placeholder="Event title" />
                <input id="eventTime" type="time" />
                <button type="submit">Add Event</button>
              </form>
              <div id="eventList"></div>
            </section>
          </section>
        </div>
      </main>

      <footer class="app-dock">
        <div class="dock-module">
          <span class="dock-icon">📋</span>
          <span class="dock-label">Taskbar</span>
          <span class="dock-kbd">T</span>
        </div>
        <div class="dock-divider"></div>
        <div class="dock-module">
          <span class="dock-icon">📅</span>
          <span class="dock-label">Calendar</span>
          <span class="dock-kbd">C</span>
        </div>
        <div class="dock-divider"></div>
        <div class="dock-module">
          <span class="dock-icon">📝</span>
          <span class="dock-label">Notes</span>
          <span class="dock-kbd">N</span>
        </div>
        <div class="dock-divider"></div>
        <div class="dock-module dock-active">
          <span class="dock-icon">⌘</span>
          <span class="dock-label">Commands</span>
          <span class="dock-kbd">K</span>
        </div>
      </footer>
    </div>
  </body>
  <script src="task-manager.js"></script>
  <script src="notes.js"></script>
  <script src="calc.js"></script>
</html>
